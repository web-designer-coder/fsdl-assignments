<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #f4f6f8;
        }
        .dashboard-title {
            font-weight: bold;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">Weather Data Visualization Dashboard</span>
    </div>
</nav>

<!-- Dashboard -->
<div class="container my-4">

    <div class="row mb-4">
        <div class="col-md-4">
            <select class="form-select" onchange="updateDashboard(this.value)">
                <option value="mumbai">Mumbai</option>
                <option value="delhi">Delhi</option>
                <option value="bangalore">Bangalore</option>
            </select>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card p-3">
                <h5 class="text-center">Weekly Temperature (°C)</h5>
                <canvas id="tempChart"></canvas>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <h5 class="text-center">Weekly Rainfall (mm)</h5>
                <canvas id="rainChart"></canvas>
            </div>
        </div>

        <div class="col-md-6 mx-auto">
            <div class="card p-3">
                <h5 class="text-center">Average Humidity (%)</h5>
                <canvas id="humidityChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    const weatherData = {
        mumbai: {
            temp: [28, 29, 30, 31, 30, 29, 28],
            rain: [12, 20, 15, 30, 25, 10, 18],
            humidity: 75
        },
        delhi: {
            temp: [22, 24, 26, 27, 25, 23, 22],
            rain: [2, 5, 0, 10, 8, 3, 1],
            humidity: 55
        },
        bangalore: {
            temp: [24, 25, 26, 27, 26, 25, 24],
            rain: [5, 12, 8, 15, 10, 6, 7],
            humidity: 65
        }
    };

    const labels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    let tempChart = new Chart(document.getElementById("tempChart"), {
        type: "line",
        data: {
            labels,
            datasets: [{
                label: "Temperature",
                data: weatherData.mumbai.temp,
                borderWidth: 2,
                fill: false
            }]
        }
    });

    let rainChart = new Chart(document.getElementById("rainChart"), {
        type: "bar",
        data: {
            labels,
            datasets: [{
                label: "Rainfall",
                data: weatherData.mumbai.rain
            }]
        }
    });

    let humidityChart = new Chart(document.getElementById("humidityChart"), {
        type: "doughnut",
        data: {
            labels: ["Humidity", "Remaining"],
            datasets: [{
                data: [weatherData.mumbai.humidity, 100 - weatherData.mumbai.humidity]
            }]
        }
    });

    function updateDashboard(city) {
        tempChart.data.datasets[0].data = weatherData[city].temp;
        rainChart.data.datasets[0].data = weatherData[city].rain;
        humidityChart.data.datasets[0].data = [
            weatherData[city].humidity,
            100 - weatherData[city].humidity
        ];

        tempChart.update();
        rainChart.update();
        humidityChart.update();
    }
</script>

</body>
</html>
