<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fashion Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f8;
        }
        .navbar {
            background-color: #111;
        }
        .product-card {
            border-radius: 15px;
            transition: 0.3s;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .price {
            color: #e63946;
            font-weight: bold;
        }
        footer {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Fashion Store</a>
        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#cartModal">
            Cart <span class="badge bg-danger" id="cartCount">0</span>
        </button>
    </div>
</nav>

<!-- Products Section -->
<section class="container py-5 mt-5">
    <h2 class="text-center mb-4">Trending Products</h2>
    <div class="row g-4" id="productList"></div>
</section>

<!-- Cart Modal -->
<div class="modal fade" id="cartModal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Shopping Cart</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartItems"></tbody>
                </table>
                <h5 class="text-end">Grand Total: ₹<span id="grandTotal">0</span></h5>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button class="btn btn-success" onclick="checkout()">Checkout</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer>
    <p>© 2026 Fashion Store | Dynamic Web Application</p>
</footer>

<!-- JavaScript -->
<script>
    const products = [
        { id: 1, name: "Men's Jacket", price: 1999 },
        { id: 2, name: "Women's Dress", price: 2499 },
        { id: 3, name: "Stylish Shoes", price: 2999 }
    ];

    let cart = {};

    function loadProducts() {
        const productList = document.getElementById("productList");
        products.forEach(p => {
            productList.innerHTML += `
                <div class="col-md-4">
                    <div class="card product-card p-3">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top">
                        <h5 class="mt-3">${p.name}</h5>
                        <p class="price">₹${p.price}</p>
                        <button class="btn btn-dark w-100" onclick="addToCart(${p.id})">
                            Add to Cart
                        </button>
                    </div>
                </div>`;
        });
    }

    function addToCart(id) {
        if (cart[id]) {
            cart[id].qty++;
        } else {
            const product = products.find(p => p.id === id);
            cart[id] = { ...product, qty: 1 };
        }
        updateCart();
    }

    function updateCart() {
        const cartItems = document.getElementById("cartItems");
        const cartCount = document.getElementById("cartCount");
        const grandTotal = document.getElementById("grandTotal");

        cartItems.innerHTML = "";
        let total = 0;
        let count = 0;

        for (let id in cart) {
            const item = cart[id];
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            count += item.qty;

            cartItems.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>₹${item.price}</td>
                    <td>
                        <input type="number" min="1" value="${item.qty}"
                        onchange="changeQty(${id}, this.value)" style="width:60px">
                    </td>
                    <td>₹${itemTotal}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="removeItem(${id})">
                            Remove
                        </button>
                    </td>
                </tr>`;
        }

        cartCount.innerText = count;
        grandTotal.innerText = total;
    }

    function changeQty(id, qty) {
        cart[id].qty = parseInt(qty);
        updateCart();
    }

    function removeItem(id) {
        delete cart[id];
        updateCart();
    }

    function checkout() {
        if (Object.keys(cart).length === 0) {
            alert("Cart is empty!");
        } else {
            alert("Order placed successfully!");
            cart = {};
            updateCart();
        }
    }

    loadProducts();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
